name: Editor package contracts
on:
  push:
    branches: ["**"]
    tags-ignore: ["coordinated-artifact-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run source:check
      - run: npm test
      - run: npm run build
      - run: npm run assets:verify
      - run: npm run audit:package
      - name: Pack the verified source snapshot without release preparation
        run: npm pack --ignore-scripts --json
      - uses: actions/upload-artifact@v4
        with:
          name: editor-source-npm-${{ matrix.os }}-node-${{ matrix.node }}
          path: "*.tgz"
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run source:check
      - run: npm run build
      - run: npm run assets:verify
      - name: Use the Ubuntu archive over HTTPS
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: editor-browser-failures
          path: test-results/
